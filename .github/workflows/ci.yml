name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: katalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d katalog"
          --health-interval 5s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/katalog
      STORAGE_DRIVER: local
      ADMIN_PASSWORD_HASH: $argon2id$dummy-hash-for-ci
      SESSION_SECRET: ci-session-secret-min-32-characters-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Migrasi (apply) & drizzle check
        run: |
          pnpm db:migrate
          pnpm db:check

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (pglite)
        run: pnpm test:int

      - name: Build
        run: pnpm build
        env:
          NEXT_OUTPUT_STANDALONE: "true"
